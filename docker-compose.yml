services:
  mysql:
    image: mysql:8.0
    container_name: stitch-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: stitch
      MYSQL_USER: stitch
      MYSQL_PASSWORD: stitchpass
    ports:
      - "3306:3306"
    volumes:
      - stitch_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ustitch", "-pstitchpass"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    container_name: stitch-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+pymysql://stitch:stitchpass@mysql:3306/stitch
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: stitch-frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  stitch_mysql_data:
